<section class="page-hero">
  <div class="container">
    <h1>Inscription à l'événement</h1>
    <p>Jusqu'à 2 participants par inscription. Les billets avec QR code arrivent par e-mail en quelques minutes.</p>
  </div>
</section>

<section class="section">
  <div class="container" style="max-width:760px">
    <div id="ph-reg-event">
      <noscript><p>Activez JavaScript pour vous inscrire à l'événement.</p></noscript>
    </div>

    <form id="ph-reg-form" class="ph-form hide" novalidate>
      <input type="hidden" name="event_id" value="">
      <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">

      <div class="reg-guests">
        <h3>Participant 1</h3>
        <div class="form-row">
          <div><label for="reg-n1">Prénom *</label><input type="text" id="reg-n1" name="nome1" required autocomplete="given-name"></div>
          <div><label for="reg-c1">Nom *</label><input type="text" id="reg-c1" name="cognome1" required autocomplete="family-name"></div>
        </div>
      </div>

      <label class="check-row" style="margin-top:20px">
        <input type="checkbox" id="reg-add-guest2">
        <span>Ajouter un deuxième participant (2 billets maximum par inscription)</span>
      </label>

      <div class="reg-guests hide" id="reg-guest2">
        <h3>Participant 2</h3>
        <div class="form-row">
          <div><label for="reg-n2">Prénom</label><input type="text" id="reg-n2" name="nome2"></div>
          <div><label for="reg-c2">Nom</label><input type="text" id="reg-c2" name="cognome2"></div>
        </div>
      </div>

      <label for="reg-email">E-mail (les billets y seront envoyés) *</label>
      <input type="email" id="reg-email" name="email" required autocomplete="email">

      <label class="check-row">
        <input type="checkbox" name="consent" required>
        <span>J'ai lu et j'accepte la <a href="privacy-eventi.html" target="_blank">politique de confidentialité des événements</a>. *</span>
      </label>

      <button class="btn btn-primary" type="submit">S'inscrire</button>
    </form>

    <div id="ph-reg-status" class="form-status" aria-live="polite"></div>
  </div>
</section>
