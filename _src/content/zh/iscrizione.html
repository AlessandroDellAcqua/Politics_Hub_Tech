<section class="page-hero">
  <div class="container">
    <h1>活动报名</h1>
    <p>每次报名最多 2 人。带二维码的门票将在几分钟内通过电子邮件发送。</p>
  </div>
</section>

<section class="section">
  <div class="container" style="max-width:760px">
    <div id="ph-reg-event">
      <noscript><p>请启用 JavaScript 以报名参加活动。</p></noscript>
    </div>

    <form id="ph-reg-form" class="ph-form hide" novalidate>
      <input type="hidden" name="event_id" value="">
      <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">

      <div class="reg-guests">
        <h3>参与者 1</h3>
        <div class="form-row">
          <div><label for="reg-n1">名字 *</label><input type="text" id="reg-n1" name="nome1" required autocomplete="given-name"></div>
          <div><label for="reg-c1">姓氏 *</label><input type="text" id="reg-c1" name="cognome1" required autocomplete="family-name"></div>
        </div>
      </div>

      <label class="check-row" style="margin-top:20px">
        <input type="checkbox" id="reg-add-guest2">
        <span>添加第二位参与者（每次报名最多 2 张门票）</span>
      </label>

      <div class="reg-guests hide" id="reg-guest2">
        <h3>参与者 2</h3>
        <div class="form-row">
          <div><label for="reg-n2">名字</label><input type="text" id="reg-n2" name="nome2"></div>
          <div><label for="reg-c2">姓氏</label><input type="text" id="reg-c2" name="cognome2"></div>
        </div>
      </div>

      <label for="reg-email">电子邮箱（门票将发送至此）*</label>
      <input type="email" id="reg-email" name="email" required autocomplete="email">

      <label class="check-row">
        <input type="checkbox" name="consent" required>
        <span>我已阅读并接受<a href="privacy-eventi.html" target="_blank">活动隐私政策</a>。*</span>
      </label>

      <button class="btn btn-primary" type="submit">提交报名</button>
    </form>

    <div id="ph-reg-status" class="form-status" aria-live="polite"></div>
  </div>
</section>
