<section class="page-hero">
  <div class="container">
    <h1>Inscripción al evento</h1>
    <p>Hasta 2 participantes por inscripción. Las entradas con código QR llegan por correo electrónico en pocos minutos.</p>
  </div>
</section>

<section class="section">
  <div class="container" style="max-width:760px">
    <div id="ph-reg-event">
      <noscript><p>Activa JavaScript para inscribirte al evento.</p></noscript>
    </div>

    <form id="ph-reg-form" class="ph-form hide" novalidate>
      <input type="hidden" name="event_id" value="">
      <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">

      <div class="reg-guests">
        <h3>Participante 1</h3>
        <div class="form-row">
          <div><label for="reg-n1">Nombre *</label><input type="text" id="reg-n1" name="nome1" required autocomplete="given-name"></div>
          <div><label for="reg-c1">Apellidos *</label><input type="text" id="reg-c1" name="cognome1" required autocomplete="family-name"></div>
        </div>
      </div>

      <label class="check-row" style="margin-top:20px">
        <input type="checkbox" id="reg-add-guest2">
        <span>Añadir un segundo participante (máx. 2 entradas por inscripción)</span>
      </label>

      <div class="reg-guests hide" id="reg-guest2">
        <h3>Participante 2</h3>
        <div class="form-row">
          <div><label for="reg-n2">Nombre</label><input type="text" id="reg-n2" name="nome2"></div>
          <div><label for="reg-c2">Apellidos</label><input type="text" id="reg-c2" name="cognome2"></div>
        </div>
      </div>

      <label for="reg-email">Correo electrónico (aquí recibirás las entradas) *</label>
      <input type="email" id="reg-email" name="email" required autocomplete="email">

      <label class="check-row">
        <input type="checkbox" name="consent" required>
        <span>He leído y acepto la <a href="privacy-eventi.html" target="_blank">Política de privacidad de los eventos</a>. *</span>
      </label>

      <button class="btn btn-primary" type="submit">Inscribirme</button>
    </form>

    <div id="ph-reg-status" class="form-status" aria-live="polite"></div>
  </div>
</section>
